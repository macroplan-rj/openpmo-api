# Configuração da API para o ambiente local (docker compose). Valores só de desenvolvimento.
spring.data.neo4j.uri=bolt://neo4j:7687
spring.data.neo4j.username=neo4j
spring.data.neo4j.password=openpmo
jwt.secret=local-jwt-secret-openpmo
jwt.refresh-secret=local-jwt-refresh-secret-openpmo
jwt.expiration=86400000
jwt.refresh-expiration=2592000000
app.login.server.idsvr.name=Keycloak
app.theme=pb
app.version=local
app.default-timezone=America/Recife
app.pathImagens=/tmp/open-pmo/imagens/
app.journalPath=/tmp/open-pmo/journal/
app.reportPath=/tmp/open-pmo/report/
app.searchCutOffScore=0.05
app.homeURI=http://localhost:4200
app.domain.cookie=localhost
app.minMC=0
app.minMCPor=project
users.administrators=admin@openpmo.dev
server.servlet.context-path=/openpmo
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.data.web.pageable.default-page-size=15
spring.data.web.pageable.max-page-size=1000
app.scheduler.everyday-at-0pm=0 0 0 1 1 ?
app.scheduler.everyday-at-8am=0 0 8 1 1 ?
app.scheduler.update-processes=0 0 0 1 1 ?
# Keycloak local: o navegador usa localhost:8180; a API fala com o container "keycloak".
spring.security.oauth2.client.registration.idsvr.client-name=open-pmo
spring.security.oauth2.client.registration.idsvr.client-id=openpmo
spring.security.oauth2.client.registration.idsvr.client-secret=openpmo-local-secret
spring.security.oauth2.client.registration.idsvr.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.idsvr.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.idsvr.scope=openid,email,profile
spring.security.oauth2.client.registration.idsvr.provider=keycloak
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8180/realms/openpmo/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/openpmo/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/openpmo/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/openpmo/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
spring.security.oauth2.client.provider.idsvr.issuer-uri=http://localhost:8180/realms/openpmo
# Integrações externas desligadas (dummy).
pentaho.api.contratos.url=http://localhost:9999/dummy
pentaho.api.liquidacao.url=http://localhost:9999/dummy
pentaho.api.uo.url=http://localhost:9999/dummy
pentaho.api.po.url=http://localhost:9999/dummy
pentaho.api.po_liquidado.url=http://localhost:9999/dummy
pentahoBI.userId=dummy
pentahoBI.password=dummy
app.uo.source=local
app.uo.localPath=/etc/openpmo/uo/unidades-orcamentarias.json
api.e-docs.uri.webapi=http://localhost:9999/dummy
api.e-docs.uri.token=http://localhost:9999/dummy
api.e-docs.grant_type=client_credentials
api.e-docs.scope=dummy
api.e-docs.client-id=dummy
api.e-docs.client-secret=dummy
api.e-docs.identificador-externo.processo-prioritario=dummy
api.organograma.uri.webapi=http://localhost:9999/dummy
api.acessocidadao.grant_type=client_credentials
api.acessocidadao.scope=dummy
api.acessocidadao.client-id=dummy
api.acessocidadao.client-secret=dummy
api.acessocidadao.uri.webapi=http://localhost:9999/dummy
api.acessocidadao.uri.token=http://localhost:9999/dummy
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dummy
spring.mail.password=dummy
logging.level.org.neo4j.ogm.drivers.bolt.request.BoltRequest=OFF
logging.level.org.neo4j.ogm.context.GraphEntityMapper=OFF
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
